# .github/workflows/weekly_report.yml
# PLACEMENT: .github/workflows/weekly_report.yml (exact path)
#
# UPGRADES & FIXES (PolyBet v2.0):
# 1. Unified concurrency group (`polybet-repo-write`) shared with
#    `daily_scan.yml` to prevent git push conflicts.
# 2. Added `rebuild_cache` workflow_dispatch input (and automatic self-healing
#    in `weekly_report.py`) to repair legacy rows in `predictions_resolved.csv`
#    where single binary markets had `primary_outcome == title` and were
#    falsely marked `is_correct = False`.
# 3. Added `git pull --rebase --autostash origin HEAD` before `git push`.

name: PolyBet Weekly Report

on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday 18:00 UTC = ~21:30 Iran time
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Who triggered this run"
        required: false
        default: "scheduled"
        type: string
      rebuild_cache:
        description: "Re-evaluate all cached resolutions from scratch"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: polybet-repo-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report and self-heal resolution cache
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DEBUG_RESOLUTION: ${{ secrets.DEBUG_RESOLUTION }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'scheduled' }}
          REBUILD_RESOLVED_CACHE: ${{ inputs.rebuild_cache || 'false' }}
        run: python weekly_report.py

      - name: Commit updated resolution cache + results dashboard
        run: |
          git config user.name "polybet-bot"
          git config user.email "polybet-bot@users.noreply.github.com"
          git add predictions_resolved.csv docs/results.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Report run ($TRIGGER_SOURCE): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin HEAD
            git push
          fi
