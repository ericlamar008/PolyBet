# .github/workflows/weekly_report.yml
# PLACEMENT: .github/workflows/weekly_report.yml
#
# Runs on TWO kinds of triggers:
#   1. schedule (Sunday 18:00 UTC) -- the regular weekly report.
#   2. workflow_dispatch with input "trigger_source" -- manual runs (from the
#      Actions tab, or from the Telegram button via the Cloudflare Worker).
#
# TEMPORARY: DEBUG_RESOLUTION is wired in below so we can dump the raw
# Polymarket API JSON for one event into the run log, to fix the
# bucket-name-vs-Yes/No issue for good. Once that's fixed, you can safely
# set the DEBUG_RESOLUTION secret to "false" (or delete it) -- this line can
# stay in the file either way, since an unset/false secret just does nothing.

name: PolyBet Weekly Report

on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday 18:00 UTC = ~21:30 Iran time
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Who triggered this run"
        required: false
        default: "scheduled"
        type: string

permissions:
  contents: write

concurrency:
  group: polybet-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DEBUG_RESOLUTION: ${{ secrets.DEBUG_RESOLUTION }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'scheduled' }}
        run: python weekly_report.py

      - name: Commit updated resolution cache + results dashboard
        run: |
          git config user.name "polybet-bot"
          git config user.email "polybet-bot@users.noreply.github.com"
          git add predictions_resolved.csv docs/results.html
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Report run ($TRIGGER_SOURCE): $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
